<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="1200" height="880" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title id="t">How Orama Lake fits together</title>
<desc id="d">People, scripts and agents reach lake through one API served as REST, OpenAPI and MCP. lake holds AI Projects and the platform services. Under it are liquid for source control, builds and deploys, zetta as the engine for each workspace, and the agents and models. The operator runs all of it as infrastructure as software, from one management cluster to dedicated leaf clusters.</desc>
