    repository: https://github.com/oramasearch/lake
    path: modules/liquid-bridge/modules/lake
    commit: a881cc31f709788b9f61ef5e3d43836acc32ef0d
    version: v0.9.0
    images:
      - {name: lake, tag: v0.9.0, digest: null}
