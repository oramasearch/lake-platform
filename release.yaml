# The Orama Lake release manifest.
#
# One stack version pins every component: its source commit, its version, and the images and other
# artifacts built from it. The installer, the Helm path, the air-gapped bundle and the operator's
# built-in defaults all read this file, so a user never has to work out which zetta goes with which
# lake. docs/release/README.md describes every field and how a stack release is cut.
#
# State: a draft. It records what this repository pins today. No stack version has been released,
# so every `digest` is empty and `published` is false. The release build fills the digests from the
# images it builds from each component's release tag; scripts/check-release-manifest.py checks that
# every `commit` here is the commit this repository pins.

schema: 1

stack:
  name: Orama Lake
  version: 0.9.0
  status: draft            # draft | candidate | released
  published: false         # true only once every image below is public and signed

# Where the images below are pulled from. Every image name is relative to it. An air-gapped install
# or a private mirror overrides it in one place (see docs/install/air-gapped.md).
registry: docker.io/oramasearch

# What the installer runs for each way in (docs/install/). `try` is the all-in-one image for a
# laptop: single-node k0s with the operator, lake, a workspace Zetta and a local model inside, and
# every image preloaded. It is built from the components below at release; it does not exist yet.
install:
  try:
    image: {name: lake-try, tag: 0.9.0, digest: null}
    port: 4900
  server:
    k0s: k0s               # the component below whose binary the server path installs
    operatorChart: orama-operator

components:
